<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" role="img" aria-label="nyo hō — profile banner">
    
  <linearGradient id="diskGroves"  x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f8ec"/>
      <stop offset="0.4" stop-color="#55455aff"/>
      <stop offset="0.65" stop-color="#17201cff"/>
      <stop offset="1" stop-color="#1b1a1aff"/>
  </linearGradient>

    <linearGradient id="bg"  x1="0"  x2="1" >
      <stop offset="0" stop-color="#5b18a8ff"/>
      <stop offset="0.5" stop-color="#9151daff"/>
      <stop offset="0.66" stop-color="#9961daff"/>
      <stop offset="1" stop-color="#9c6ed1ff"/>
  </linearGradient>
  
  <rect width="700" height="200" rx="10" fill="url(#bg)"/>

        <image href="Cover.jpg" x="400" y="20" width="300" height="300" preserveAspectRatio="xMidYMid slice" />
  
  <g id="disk">
  <circle cx="80" cy="100" r="70" fill="#000000"/>
  <circle cx="80" cy="100" r="60" fill="none" stroke="url(#diskGroves)" transform="rotate(70 80 100)" stroke-width="1.4" stroke-dasharray="" stroke-opacity="0.5"/>
  <circle cx="80" cy="100" r="50" fill="none" stroke="url(#diskGroves)" transform="rotate(90 80 100)" stroke-width="1.4" stroke-dasharray="" stroke-opacity="0.5"/>
  <circle cx="80" cy="100" r="40" fill="none" stroke="url(#diskGroves)" transform="rotate(50 80 100)" stroke-width="1.4" stroke-dasharray="" stroke-opacity="0.5"/>
  <circle id="cover" cx="80" cy="100" r="30" fill="url(#image-fill)"/>
  <circle cx="80" cy="100" r="1" fill="#0000000" stroke-width="3"/>
  </g>

  <rect x="175" y="95" width="500" height="5" rx="1" fill="#ffffff"/>
  <circle id="slider" cx="175" cy="97.5" r="7" fill="#ffffff"/>
  
  <text x="175" y="75" font-family="Helvetica, Arial" font-size="40" fill="#e9f0dc">Now Playing... SPIN</text>

  <text x="175" y="135" font-family="Helvetica" font-size="20" fill="#e9f0dc">By Kroi</text>

  <animateTransform href="#disk" attributeName="transform" type="rotate" from="0 80 100" to="360 80 100" dur="4s" repeatCount="indefinite"/>

  <animateTransform href="#slider" attributeName="transform" to="500" dur="30s" repeatCount="indefinite"/>

</svg>
